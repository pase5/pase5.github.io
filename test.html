<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase Logo & Preloader Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 space-y-12">

    <div class="text-center space-y-2">
        <h1 class="text-3xl font-bold tracking-tight text-white">Asset Preview</h1>
        <p class="text-sm text-gray-400">Previewing the new <span class="text-lime-400 font-mono">pase.png</span> logo and <span class="text-cyan-400 font-mono">VN20261014_223223.mp4</span> loading animation.</p>
    </div>

    <!-- Logo Showcase -->
    <div class="w-full max-w-2xl bg-neutral-900/60 border border-white/10 rounded-2xl p-8 backdrop-blur-md space-y-6">
        <h2 class="text-xs uppercase font-mono tracking-widest text-lime-400">01. Logo Asset (pase.png)</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 items-center">
            <!-- Dark Background -->
            <div class="p-6 bg-black rounded-xl border border-white/5 flex flex-col items-center justify-center space-y-3">
                <span class="text-xs text-gray-500 font-mono">Dark Canvas</span>
                <img src="pase.png" alt="Pase Logo on Dark" class="h-10 w-auto object-contain">
            </div>
            <!-- Pill Nav Container Preview -->
            <div class="p-6 bg-neutral-950 rounded-xl border border-white/5 flex flex-col items-center justify-center space-y-3">
                <span class="text-xs text-gray-500 font-mono">Navbar Pill Preview</span>
                <div class="w-[82px] h-[44px] rounded-full bg-white/5 hover:bg-white/10 border border-white/10 p-[7px_14px] flex items-center justify-center transition-all cursor-pointer">
                    <img src="pase.png" alt="Pase Navbar" class="w-full h-full object-contain">
                </div>
            </div>
        </div>
    </div>

    <!-- Video Animation Showcase -->
    <div class="w-full max-w-2xl bg-neutral-900/60 border border-white/10 rounded-2xl p-8 backdrop-blur-md space-y-6">
        <div class="flex items-center justify-between">
            <h2 class="text-xs uppercase font-mono tracking-widest text-cyan-400">02. Loading Animation (VN20261014_223223.mp4)</h2>
            <a href="index.html" class="text-xs text-lime-400 hover:underline font-mono">View Full Site &rarr;</a>
        </div>
        <div class="relative rounded-xl overflow-hidden bg-black border border-white/10 aspect-video flex items-center justify-center shadow-2xl">
            <video id="preview-video" src="VN20261014_223223.mp4" autoplay loop playsinline controls class="w-full h-full object-contain"></video>
        </div>
    </div>

    <script>
        const v = document.getElementById("preview-video");
        if (v) {
            v.volume = 0.5;
            v.muted = false;
            v.play().catch(() => {
                // If browser restricts unmuted autoplay, play muted and let user unmute via controls
                v.muted = true;
                v.play();
            });
        }
    </script>

</body>
</html>
